name: Build Docker image (CNB quota card)

on:
  push:
    branches:
      - cnb-quota-card
  workflow_dispatch:

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      # Optional second registry (e.g. Aliyun ACR) for fast mainland pulls.
      # Leave the secrets unset to skip it — the GHCR push always runs.
      ALIYUN_IMAGE: ${{ secrets.ALIYUN_IMAGE }}
      ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
      ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Write VERSION
        run: echo "v$(date +%Y%m%d)-${GITHUB_SHA::7}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Aliyun registry (optional)
        id: aliyun
        if: env.ALIYUN_IMAGE != ''
        run: |
          full="${ALIYUN_IMAGE%/}"
          host="${full%%/*}"
          if [ -z "$host" ] || [ "$host" = "$full" ]; then
            echo "::error::ALIYUN_IMAGE must look like registry.cn-hangzhou.aliyuncs.com/<namespace>/new-api"
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: env.ALIYUN_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.aliyun.outputs.host }}
          username: ${{ env.ALIYUN_USERNAME }}
          password: ${{ env.ALIYUN_PASSWORD }}

      - name: Compose image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ steps.image.outputs.name }}:cnb"
            echo "${{ steps.image.outputs.name }}:cnb-${GITHUB_SHA::7}"
            if [ -n "$ALIYUN_IMAGE" ]; then
              echo "${{ steps.aliyun.outputs.full }}:cnb"
              echo "${{ steps.aliyun.outputs.full }}:cnb-${GITHUB_SHA::7}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Aliyun ACR rejects the OCI attestation manifests buildx attaches
          # by default ("unknown manifest class"); GHCR is fine without them.
          provenance: false

      - name: Image summary
        run: |
          echo "### Docker image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.image.outputs.name }}:cnb" >> $GITHUB_STEP_SUMMARY
          if [ -n "$ALIYUN_IMAGE" ]; then
            echo "${{ steps.aliyun.outputs.full }}:cnb" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
